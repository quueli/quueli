name: profile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install doteki
      - name: rebuild banner
        run: python scripts/build_banner.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - run: doteki
      - name: commit
        run: |
          git config user.name "quueli"
          git config user.email "rampadian@mail.ru"
          git add README.md assets/banner.svg assets/calendar.json
          git diff --quiet --cached || git commit -m "refresh"
          git push
